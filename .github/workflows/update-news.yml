name: Update news

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub's minimum)
  workflow_dispatch:         # lets you run it manually with a button

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser

      - name: Load previous articles
        run: |
          git fetch origin data || true
          if git show origin/data:articles.json > /tmp/prev.json 2>/dev/null; then
            cp /tmp/prev.json articles.json
          else
            echo "No data branch yet, starting from the file on main"
          fi

      - name: Fetch news
        run: python fetch_news.py

      - name: Publish to data branch
        run: |
          mkdir out
          cp articles.json out/
          echo '{"git":{"deploymentEnabled":false}}' > out/vercel.json
          cd out
          git init -q
          git checkout -q -b data
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add .
          git commit -q -m "Update news"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
