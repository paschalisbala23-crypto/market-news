<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AGORA NEWS - Global markets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Marcellus&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050309; --panel:#0a0614; --ink:#f0eafa; --muted:#a396bd; --line:#180f27; --accent:#b99cff; --tag:#120a20;
  --ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
}
:root{color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--ui)}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
header .search input::placeholder{color:var(--muted)}
.bar{max-width:1100px;margin:0 auto;padding:12px 20px;display:grid;grid-template-columns:1fr minmax(0,420px) 1fr;align-items:center;gap:20px}
.brand{font:400 32px/1 "Marcellus",Georgia,"Times New Roman",serif;letter-spacing:.08em;white-space:nowrap;-webkit-text-stroke:.8px currentColor}
.search{width:100%;justify-self:center}
.search input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.stamp{font-size:13px;color:var(--muted);white-space:nowrap;justify-self:end}

.ticker{background:var(--panel);border-bottom:1px solid var(--line);color-scheme:light;min-height:38px;overflow:hidden}
.ticker .tradingview-widget-container{zoom:.8}

.sessions{max-width:1100px;margin:0 auto;padding:16px 20px 0;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sess{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 12px}
.sess .top{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:.07em;text-transform:uppercase}
.sess .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);opacity:.6;flex:none}
.sess .clock{margin-left:auto;font-weight:400;font-variant-numeric:tabular-nums;color:var(--muted);letter-spacing:0}
.sess .note{margin-top:2px;font-size:12px;color:var(--muted)}
.sess.open{border-color:#2c5a46}
.sess.open .dot{background:#5fd38d;opacity:1;box-shadow:0 0 0 3px rgba(95,211,141,.2)}
.sess.open .note{color:#8fdcaa}
@media (max-width:760px){.sessions{grid-template-columns:repeat(2,1fr);padding-top:12px}}

.views{display:flex;gap:4px;margin:0 0 18px;border-bottom:1px solid var(--line)}
.views button{padding:9px 14px;margin-bottom:-1px;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);font:inherit;cursor:pointer}
.views button:hover{color:var(--ink)}
.views button[aria-pressed="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.views{overflow-x:auto}
.views button{white-space:nowrap}
.calc-item{background:var(--panel);border:1px solid var(--line);border-radius:6px;margin-bottom:12px;overflow:hidden}
.calc-head{display:grid;grid-template-columns:1fr 150px;gap:16px;align-items:center;width:100%;text-align:left;padding:14px 16px;border:0;background:none;color:var(--ink);font:inherit;cursor:pointer}
.calc-head:hover .calc-name{color:var(--accent)}
.calc-name{display:block;font:600 18px/1.3 var(--serif)}
.calc-name::after{content:" +";color:var(--muted)}
.calc-head[aria-expanded="true"] .calc-name::after{content:" \2212"}
.calc-desc{display:block;margin-top:4px;color:var(--muted);font-size:14px;max-width:70ch}
.calc-thumb svg{display:block;width:100%;height:auto}
.calc-thumb .t-frame{fill:var(--bg);stroke:var(--line)}
.calc-thumb .t-in{fill:var(--panel);stroke:var(--line)}
.calc-thumb .t-bar{fill:var(--line)}
.calc-thumb .t-acc{fill:var(--accent)}
.calc-thumb .t-res{fill:none;stroke:var(--accent)}
.calc-thumb .t-ln{stroke:var(--line);stroke-width:1}
.calc-thumb .t-pv{stroke:var(--accent);stroke-width:1.5}
.calc-thumb .t-line{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-linejoin:round;opacity:.8}
.calc-thumb .t-txt{fill:var(--muted);font:8px var(--ui)}
.calc-thumb .t-hi{fill:var(--accent);font:600 9px var(--ui)}
@media (max-width:520px){.calc-head{grid-template-columns:1fr 96px;gap:12px}}
.calc-body{padding:4px 16px 18px;border-top:1px solid var(--line)}
.calc-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:14px 0}
.calc-form label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.calc-form input,.calc-form select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.calc-row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.calc-row strong{color:var(--accent)}
.calc-msg{padding:8px 0;color:var(--muted)}
.calc-note{margin:10px 0 0;font-size:12px;color:var(--muted)}
.cal{color-scheme:light}
.cal .tradingview-widget-copyright{font-size:11px;text-align:center;padding-top:6px}
.cal .tradingview-widget-copyright a{color:var(--muted);text-decoration:none}

.fng{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px 10px;text-align:center;font-size:13px;color:var(--muted)}
.fng h4{margin:0 0 6px;font:600 12px/1.2 var(--ui);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.fng .gauge{color:var(--ink)}
.fng svg{display:block;width:100%;max-width:190px;margin:0 auto}
.fng .val{margin-top:-6px;font:600 32px/1 var(--serif);color:var(--ink)}
.fng .lab{margin-top:4px;font-weight:600;font-size:14px;color:var(--ink)}
.fng .hist{display:flex;justify-content:space-between;gap:8px;margin-top:10px;font-size:12px}
.fng .src{margin-top:8px;font-size:11px}
.fng .src a{color:var(--muted)}

footer{max-width:1100px;margin:0 auto;padding:20px 20px 40px;border-top:1px solid var(--line);font-size:12px;line-height:1.6;color:var(--muted);text-align:center}
footer p{margin:0}
footer p + p{margin-top:4px}
footer a{color:var(--muted)}
footer a:hover{color:var(--ink)}
.ticker .tradingview-widget-copyright{font-size:10px;text-align:center;padding:0 0 2px;line-height:1.2}
.ticker .tradingview-widget-copyright a{color:var(--muted);text-decoration:none}
.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 60px;display:grid;grid-template-columns:210px 1fr;gap:32px}
.side{position:sticky;top:78px;align-self:start}
nav button{display:flex;justify-content:space-between;width:100%;text-align:left;padding:8px 10px;margin:0 0 2px;border:0;border-left:3px solid transparent;background:none;color:var(--muted);font:inherit;cursor:pointer}
nav button:hover{color:var(--ink)}
nav button[aria-pressed="true"]{color:var(--ink);font-weight:600;border-left-color:var(--accent);background:var(--panel)}
nav .n{font-variant-numeric:tabular-nums;font-size:13px}

h2.day{margin:28px 0 6px;font:600 13px/1 var(--ui);color:var(--muted);letter-spacing:.02em}
h2.day:first-child{margin-top:0}
.item{display:grid;grid-template-columns:56px 1fr;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:3px}
.item h3{margin:0 0 4px;font:600 19px/1.3 var(--serif)}
.item h3 a{text-decoration:none}
.item h3 a:hover{color:var(--accent);text-decoration:underline}
.item p{margin:0 0 8px;color:var(--muted);max-width:68ch}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.src{font-weight:600}
.tag{background:var(--tag);color:var(--muted);padding:1px 8px;border-radius:10px;font-size:12px}
.msg{padding:40px 0;color:var(--muted)}
.more{display:block;margin:24px auto 0;padding:10px 22px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:inherit;cursor:pointer}

@media (max-width:760px){
  .bar{display:flex;flex-wrap:wrap;gap:10px}
  .brand{font-size:24px}
  .search{order:3;max-width:none;flex-basis:100%;margin:0}
  .stamp{margin-left:auto}
  .wrap{grid-template-columns:1fr;gap:16px;padding-top:16px}
  .side{position:static}
  nav{display:flex;overflow-x:auto;gap:6px;padding-bottom:4px}
  nav button{width:auto;white-space:nowrap;border:1px solid var(--line);border-radius:16px;margin:0;gap:8px}
  nav button[aria-pressed="true"]{border-color:var(--accent)}
  .item{grid-template-columns:1fr;gap:2px}
  .item h3{font-size:18px}
}
</style>
</head>

<script>
const CATS = [
  ["all","All markets"],["forex","Forex"],["stocks","Stocks"],["crypto","Crypto"],
  ["futures","Futures & commodities"],["bonds","Bonds"],["indices","Indices"],
  ["macro","Macro & central banks"]
];
const LABEL = Object.fromEntries(CATS);
const PAGE = 60;
const DATA_URL = "https://raw.githubusercontent.com/paschalisbala23-crypto/market-news/data/articles.json";
let all = [], cat = "all", query = "", shown = PAGE, updated = null;

const $ = id => document.getElementById(id);
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
};

function ago(date){
  const m = Math.round((Date.now() - date) / 60000);
  if (m < 1) return "just now";
  if (m < 60) return m + " min ago";
  const h = Math.round(m / 60);
  return h < 24 ? h + " h ago" : Math.round(h / 24) + " d ago";
}

function dayLabel(d){
  const today = new Date(), yest = new Date(Date.now() - 864e5);
  if (d.toDateString() === today.toDateString()) return "Today";
  if (d.toDateString() === yest.toDateString()) return "Yesterday";
  return d.toLocaleDateString(undefined, {weekday:"long", day:"numeric", month:"long"});
}

function matches(a){
  if (cat !== "all" && !a.categories.includes(cat)) return false;
  if (!query) return true;
  return (a.title + " " + a.snippet + " " + a.source).toLowerCase().includes(query);
}

function renderNav(){
  const nav = $("nav");
  nav.textContent = "";
  CATS.forEach(([key, name]) => {
    const b = el("button");
    b.setAttribute("aria-pressed", key === cat);
    b.append(el("span", "", name));
    b.onclick = () => { cat = key; shown = PAGE; showView("news"); render(); };
    nav.append(b);
  });
}

function renderFeed(){
  const feed = $("feed");
  feed.textContent = "";
  const list = all.filter(matches);
  if (!list.length){
    feed.append(el("div", "msg", query ? "No articles match your search. Try a different word." : "No articles in this market yet."));
    return;
  }
  let lastDay = "";
  list.slice(0, shown).forEach(a => {
    const d = new Date(a.published);
    const label = dayLabel(d);
    if (label !== lastDay){ feed.append(el("h2", "day", label)); lastDay = label; }

    const item = el("article", "item");
    item.append(el("div", "time", d.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"})));

    const body = el("div");
    const h = el("h3");
    const link = el("a", "", a.title);
    if (/^https?:\/\//.test(a.link)) link.href = a.link;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    h.append(link);
    body.append(h);
    if (a.snippet) body.append(el("p", "", a.snippet));

    const meta = el("div", "meta");
    meta.append(el("span", "src", a.source));
    a.categories.filter(c => LABEL[c] && c !== "all").slice(0, 3)
      .forEach(c => meta.append(el("span", "tag", LABEL[c])));
    body.append(meta);

    item.append(body);
    feed.append(item);
  });

  if (list.length > shown){
    const more = el("button", "more", "Show more");
    more.onclick = () => { shown += PAGE; renderFeed(); };
    feed.append(more);
  }
}

function render(){ renderNav(); renderFeed(); }

function renderStamp(){
  $("stamp").textContent = updated ? "Updated " + ago(updated) : "";
}

async function load(){
  try {
    let res;
    try {
      res = await fetch(DATA_URL + "?t=" + Date.now());
      if (!res.ok) throw new Error(res.status);
    } catch (e) {
      res = await fetch("articles.json?t=" + Date.now());
      if (!res.ok) throw new Error(res.status);
    }
    const data = await res.json();
    all = data.articles || [];
    updated = new Date(data.updated);
    render();
    renderStamp();
  } catch (e) {
    if (!all.length){
      $("feed").textContent = "";
      $("feed").append(el("div", "msg", "News could not be loaded. Check that articles.json exists in your repository, then refresh."));
    }
  }
}

/* ---- Market sessions clock (typical forex hours, local time, Mon-Fri) ---- */
const SESSIONS = [
  {name: "Sydney",   tz: "Australia/Sydney", open: 7, close: 16},
  {name: "Tokyo",    tz: "Asia/Tokyo",       open: 9, close: 18},
  {name: "London",   tz: "Europe/London",    open: 8, close: 17},
  {name: "New York", tz: "America/New_York", open: 8, close: 17}
];
const WEEKDAY = {Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6};

function localParts(tz){
  const parts = new Intl.DateTimeFormat("en-GB", {
    timeZone: tz, weekday: "short", hour: "2-digit", minute: "2-digit", hourCycle: "h23"
  }).formatToParts(new Date());
  const get = type => parts.find(p => p.type === type).value;
  return {wd: WEEKDAY[get("weekday")], h: +get("hour"), m: +get("minute")};
}

function span(mins){
  const h = Math.floor(mins / 60), m = mins % 60;
  if (h >= 24) return Math.floor(h / 24) + "d " + (h % 24) + "h";
  return (h ? h + "h " : "") + m + "m";
}

function sessionState(s){
  const {wd, h, m} = localParts(s.tz);
  const now = h * 60 + m, open = s.open * 60, close = s.close * 60;
  const clock = String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
  const weekday = wd >= 1 && wd <= 5;

  if (weekday && now >= open && now < close){
    return {isOpen: true, clock, text: "Open \u00b7 closes in " + span(close - now)};
  }
  let mins = 0;
  for (let d = 0; d <= 7; d++){
    const day = (wd + d) % 7;
    if (day < 1 || day > 5) continue;
    if (d === 0 && now >= open) continue;
    mins = d === 0 ? open - now : d * 1440 - now + open;
    break;
  }
  return {isOpen: false, clock, text: "Closed \u00b7 opens in " + span(mins)};
}

function renderSessions(){
  const box = $("sessions");
  box.textContent = "";
  SESSIONS.forEach(s => {
    const st = sessionState(s);
    const card = el("div", "sess" + (st.isOpen ? " open" : ""));
    const top = el("div", "top");
    top.append(el("span", "dot"), el("span", "", s.name), el("span", "clock", st.clock));
    card.append(top, el("div", "note", st.text));
    box.append(card);
  });
}

renderSessions();
setInterval(renderSessions, 30 * 1000);

/* ---- Calculators ---- */
let calcBuilt = false;
const fmt = (n, d = 2) => isFinite(n) ? n.toLocaleString(undefined, {minimumFractionDigits: d, maximumFractionDigits: d}) : "-";
const PIPS = {"EUR/USD": [0.0001, 0], "GBP/USD": [0.0001, 0], "AUD/USD": [0.0001, 0], "NZD/USD": [0.0001, 0],
              "USD/JPY": [0.01, 1], "USD/CHF": [0.0001, 1], "USD/CAD": [0.0001, 1]};

const THUMBS = {
  size: '<svg viewBox="0 0 150 96" aria-hidden="true"><rect class="t-frame" x="1" y="1" width="148" height="94" rx="6"/>' +
    '<rect class="t-bar" x="10" y="12" width="40" height="5" rx="2"/><rect class="t-in" x="72" y="9" width="68" height="11" rx="3"/>' +
    '<rect class="t-bar" x="10" y="30" width="34" height="5" rx="2"/><rect class="t-in" x="72" y="27" width="68" height="11" rx="3"/>' +
    '<rect class="t-bar" x="10" y="48" width="44" height="5" rx="2"/><rect class="t-in" x="72" y="45" width="68" height="11" rx="3"/>' +
    '<rect class="t-res" x="10" y="68" width="130" height="19" rx="4"/><text class="t-hi" x="75" y="81" text-anchor="middle">0.40 lots</text></svg>',
  pip: '<svg viewBox="0 0 150 96" aria-hidden="true"><rect class="t-frame" x="1" y="1" width="148" height="94" rx="6"/>' +
    '<text class="t-txt" x="10" y="21">EUR/USD</text><text class="t-hi" x="140" y="21" text-anchor="end">$10.00</text><line class="t-ln" x1="8" x2="142" y1="28" y2="28"/>' +
    '<text class="t-txt" x="10" y="42">GBP/USD</text><text class="t-hi" x="140" y="42" text-anchor="end">$10.00</text><line class="t-ln" x1="8" x2="142" y1="49" y2="49"/>' +
    '<text class="t-txt" x="10" y="63">USD/JPY</text><text class="t-hi" x="140" y="63" text-anchor="end">$6.34</text><line class="t-ln" x1="8" x2="142" y1="70" y2="70"/>' +
    '<text class="t-txt" x="10" y="84">USD/CAD</text><text class="t-hi" x="140" y="84" text-anchor="end">$7.30</text></svg>',
  pivot: '<svg viewBox="0 0 150 96" aria-hidden="true"><rect class="t-frame" x="1" y="1" width="148" height="94" rx="6"/>' +
    '<text class="t-txt" x="9" y="18">R3</text><line class="t-ln" x1="30" x2="140" y1="15" y2="15"/>' +
    '<text class="t-txt" x="9" y="30">R2</text><line class="t-ln" x1="30" x2="140" y1="27" y2="27"/>' +
    '<text class="t-txt" x="9" y="42">R1</text><line class="t-ln" x1="30" x2="140" y1="39" y2="39"/>' +
    '<text class="t-hi" x="9" y="54">P</text><line class="t-pv" x1="30" x2="140" y1="51" y2="51"/>' +
    '<text class="t-txt" x="9" y="66">S1</text><line class="t-ln" x1="30" x2="140" y1="63" y2="63"/>' +
    '<text class="t-txt" x="9" y="78">S2</text><line class="t-ln" x1="30" x2="140" y1="75" y2="75"/>' +
    '<text class="t-txt" x="9" y="90">S3</text><line class="t-ln" x1="30" x2="140" y1="87" y2="87"/>' +
    '<polyline class="t-line" points="36,62 54,40 72,54 90,28 108,46 130,24"/></svg>',
  margin: '<svg viewBox="0 0 150 96" aria-hidden="true"><rect class="t-frame" x="1" y="1" width="148" height="94" rx="6"/>' +
    '<text class="t-txt" x="10" y="20">Position value</text><rect class="t-in" x="10" y="25" width="130" height="10" rx="3"/><rect class="t-bar" x="10" y="25" width="130" height="10" rx="3"/>' +
    '<text class="t-txt" x="10" y="52">Margin needed</text><text class="t-hi" x="140" y="52" text-anchor="end">1:30</text>' +
    '<rect class="t-in" x="10" y="57" width="130" height="10" rx="3"/><rect class="t-acc" x="10" y="57" width="36" height="10" rx="3"/>' +
    '<text class="t-txt" x="10" y="85">Used 36.7% of balance</text></svg>'
};

const CALCS = [
  {
    name: "Position Size Calculator",
    desc: "Works out how many lots to trade so that a stop-loss hit costs only the percentage of your account you choose to risk.",
    note: "Assumes a USD account. Pip value per standard lot is $10 for pairs like EUR/USD; change it for other pairs.",
    fields: [
      {k: "bal", label: "Account balance ($)", v: 10000},
      {k: "risk", label: "Risk per trade (%)", v: 1},
      {k: "sl", label: "Stop loss (pips)", v: 25},
      {k: "pv", label: "Pip value per 1 lot ($)", v: 10}
    ],
    run: v => {
      const b = +v.bal, r = +v.risk, s = +v.sl, p = +v.pv;
      if (!(b > 0 && r > 0 && s > 0 && p > 0)) return null;
      const risk = b * r / 100, lots = risk / (s * p);
      return [["Amount at risk", "$" + fmt(risk)], ["Position size", fmt(lots, 2) + " lots"],
              ["Units", fmt(lots * 100000, 0)], ["Mini lots (0.1)", fmt(lots * 10, 1)]];
    }
  },
  {
    name: "Pip Calculator",
    desc: "Shows how much one pip is worth in money for a given currency pair and lot size, so you know what each price move means for your account.",
    note: "USD account. Standard lot = 100,000 units. Crosses such as EUR/JPY need an extra conversion and are not included.",
    fields: [
      {k: "pair", label: "Currency pair", v: "EUR/USD", options: Object.keys(PIPS).map(p => [p, p])},
      {k: "lots", label: "Lot size", v: 1},
      {k: "price", label: "Current price", v: 1.1},
      {k: "pips", label: "Number of pips", v: 10}
    ],
    run: v => {
      const [pip, baseUSD] = PIPS[v.pair], lots = +v.lots, price = +v.price, n = +v.pips;
      if (!(lots > 0 && price > 0 && n > 0)) return null;
      const q = lots * 100000 * pip, usd = baseUSD ? q / price : q;
      const quote = v.pair.split("/")[1];
      const rows = quote === "USD" ? [] : [["Pip value (" + quote + ")", fmt(q)]];
      rows.push(["Pip value (USD)", "$" + fmt(usd)], [n + " pips", "$" + fmt(usd * n)]);
      return rows;
    }
  },
  {
    name: "Pivot Point Calculator",
    desc: "Calculates support and resistance levels from the previous day's high, low and close. Traders use them to spot likely turning points during the day.",
    note: "Use the previous period's high, low and close. Works for any market, not only forex.",
    fields: [
      {k: "m", label: "Method", v: "std", options: [["std", "Standard"], ["fib", "Fibonacci"], ["cam", "Camarilla"]]},
      {k: "h", label: "Previous high", v: 1.105},
      {k: "l", label: "Previous low", v: 1.095},
      {k: "c", label: "Previous close", v: 1.1}
    ],
    run: v => {
      const H = +v.h, L = +v.l, C = +v.c;
      if (!(H > 0 && L > 0 && C > 0 && H >= L)) return null;
      const R = H - L, P = (H + L + C) / 3;
      let rows;
      if (v.m === "fib") rows = [["R3", P + R], ["R2", P + 0.618 * R], ["R1", P + 0.382 * R], ["Pivot", P],
                                 ["S1", P - 0.382 * R], ["S2", P - 0.618 * R], ["S3", P - R]];
      else if (v.m === "cam") rows = [["R4", C + R * 1.1 / 2], ["R3", C + R * 1.1 / 4], ["R2", C + R * 1.1 / 6], ["R1", C + R * 1.1 / 12],
                                      ["Pivot", P], ["S1", C - R * 1.1 / 12], ["S2", C - R * 1.1 / 6], ["S3", C - R * 1.1 / 4], ["S4", C - R * 1.1 / 2]];
      else rows = [["R3", H + 2 * (P - L)], ["R2", P + R], ["R1", 2 * P - L], ["Pivot", P],
                   ["S1", 2 * P - H], ["S2", P - R], ["S3", L - 2 * (H - P)]];
      return rows.map(([n, x]) => [n, fmt(x, 5)]);
    }
  },
  {
    name: "Margin Calculator",
    desc: "Shows how much money your broker sets aside to open a leveraged position, and how much of your account that uses.",
    note: "USD account. Standard lot = 100,000 units. Balance is optional; add it to see margin used and free margin.",
    fields: [
      {k: "t", label: "Pair type", v: "quote", options: [["quote", "USD is quote (e.g. EUR/USD)"], ["base", "USD is base (e.g. USD/JPY)"]]},
      {k: "lots", label: "Lot size", v: 1},
      {k: "price", label: "Current price", v: 1.1},
      {k: "lev", label: "Leverage (30 means 1:30)", v: 30},
      {k: "bal", label: "Account balance ($, optional)", v: 10000}
    ],
    run: v => {
      const lots = +v.lots, price = +v.price, lev = +v.lev, bal = +v.bal;
      if (!(lots > 0 && price > 0 && lev > 0)) return null;
      const notional = v.t === "quote" ? lots * 100000 * price : lots * 100000, margin = notional / lev;
      const rows = [["Position value", "$" + fmt(notional)], ["Required margin", "$" + fmt(margin)]];
      if (bal > 0) rows.push(["Margin used", fmt(margin / bal * 100) + "% of balance"], ["Free margin", "$" + fmt(bal - margin)]);
      return rows;
    }
  }
];

["size", "pip", "pivot", "margin"].forEach((k, i) => { CALCS[i].thumb = THUMBS[k]; });

function buildCalcs(){
  calcBuilt = true;
  const box = $("calc");
  const items = [];
  CALCS.forEach(c => {
    const item = el("div", "calc-item");
    const head = el("button", "calc-head");
    head.type = "button";
    head.setAttribute("aria-expanded", "false");
    const text = el("span", "calc-text");
    text.append(el("span", "calc-name", c.name), el("span", "calc-desc", c.desc));
    const thumb = el("span", "calc-thumb");
    thumb.insertAdjacentHTML("beforeend", c.thumb);
    head.append(text, thumb);

    const body = el("div", "calc-body");
    body.hidden = true;
    const form = el("div", "calc-form");
    const out = el("div", "calc-out");
    const inputs = {};

    const update = () => {
      const vals = {};
      for (const k in inputs) vals[k] = inputs[k].value;
      const rows = c.run(vals);
      out.textContent = "";
      if (!rows){ out.append(el("div", "calc-msg", "Fill in every field with valid positive numbers.")); return; }
      rows.forEach(([label, value]) => {
        const row = el("div", "calc-row");
        row.append(el("span", "", label), el("strong", "", value));
        out.append(row);
      });
    };

    c.fields.forEach(f => {
      const label = el("label", "", f.label);
      let input;
      if (f.options){
        input = el("select");
        f.options.forEach(([val, text]) => { const o = el("option", "", text); o.value = val; input.append(o); });
        input.value = f.v;
      } else {
        input = el("input");
        input.type = "number";
        input.step = "any";
        input.inputMode = "decimal";
        input.value = f.v;
      }
      input.addEventListener("input", update);
      inputs[f.k] = input;
      label.append(input);
      form.append(label);
    });

    body.append(form, out, el("p", "calc-note", c.note));
    head.onclick = () => {
      const opening = body.hidden;
      items.forEach(i => { i.body.hidden = true; i.head.setAttribute("aria-expanded", "false"); });
      body.hidden = !opening;
      head.setAttribute("aria-expanded", String(opening));
      if (opening) update();
    };
    items.push({head, body});
    item.append(head, body);
    box.append(item);
  });
}

/* ---- Crypto Fear & Greed gauge (data: alternative.me) ---- */
const FNG_URL = "https://api.alternative.me/fng/?limit=8";
const FNG_BANDS = [[0, 25, "#e5534b"], [25, 45, "#e8913a"], [45, 55, "#e3c04a"], [55, 75, "#8fd16a"], [75, 100, "#3fbf72"]];

function fngPoint(v, r){
  const a = Math.PI * (1 - v / 100);
  return [100 + r * Math.cos(a), 100 - r * Math.sin(a)];
}

function fngSvg(value){
  const arcs = FNG_BANDS.map(([from, to, color]) => {
    const [x1, y1] = fngPoint(from, 80), [x2, y2] = fngPoint(to, 80);
    return '<path d="M' + x1.toFixed(1) + " " + y1.toFixed(1) + " A80 80 0 0 1 " + x2.toFixed(1) + " " + y2.toFixed(1) +
           '" stroke="' + color + '" stroke-width="14" fill="none"/>';
  }).join("");
  const [nx, ny] = fngPoint(value, 64);
  return '<svg viewBox="0 0 200 112" role="img" aria-label="Fear and greed gauge showing ' + value + ' out of 100">' + arcs +
         '<line x1="100" y1="100" x2="' + nx.toFixed(1) + '" y2="' + ny.toFixed(1) + '" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>' +
         '<circle cx="100" cy="100" r="6" fill="currentColor"/></svg>';
}

async function loadFng(){
  const box = $("fng");
  try {
    const res = await fetch(FNG_URL);
    if (!res.ok) throw new Error(res.status);
    const rows = (await res.json()).data || [];
    const now = Number(rows[0].value);
    if (!isFinite(now) || now < 0 || now > 100) throw new Error("bad data");

    box.textContent = "";
    box.append(el("h4", "", "Crypto Fear & Greed"));
    const gauge = el("div", "gauge");
    gauge.insertAdjacentHTML("beforeend", fngSvg(now));
    box.append(gauge, el("div", "val", String(now)), el("div", "lab", rows[0].value_classification || ""));

    const hist = el("div", "hist");
    if (rows[1]) hist.append(el("span", "", "Yesterday " + rows[1].value));
    if (rows[7]) hist.append(el("span", "", "Last week " + rows[7].value));
    box.append(hist);

    const src = el("div", "src");
    const link = el("a", "", "Source: alternative.me");
    link.href = "https://alternative.me/crypto/fear-and-greed-index/";
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    src.append(link);
    box.append(src);
  } catch (e) {
    if (!box.querySelector("svg")) box.textContent = "Fear & Greed gauge is unavailable right now.";
  }
}

loadFng();
