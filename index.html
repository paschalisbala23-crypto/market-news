<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AGORA NEWS - Global markets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Marcellus&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050309; --panel:#0a0614; --ink:#f0eafa; --muted:#a396bd; --line:#180f27; --accent:#b99cff; --tag:#120a20;
  --ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
}
:root{color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--ui)}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
header .search input::placeholder{color:var(--muted)}
.bar{max-width:1100px;margin:0 auto;padding:12px 20px;display:grid;grid-template-columns:1fr minmax(0,420px) 1fr;align-items:center;gap:20px}
.brand{font:400 32px/1 "Marcellus",Georgia,"Times New Roman",serif;letter-spacing:.08em;white-space:nowrap;-webkit-text-stroke:.8px currentColor}
.search{width:100%;justify-self:center}
.search input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.stamp{font-size:13px;color:var(--muted);white-space:nowrap;justify-self:end}

.ticker{background:var(--panel);border-bottom:1px solid var(--line);color-scheme:light;min-height:38px;overflow:hidden}
.ticker .tradingview-widget-container{zoom:.8}

.sessions{max-width:1100px;margin:0 auto;padding:16px 20px 0;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sess{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 12px}
.sess .top{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:.07em;text-transform:uppercase}
.sess .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);opacity:.6;flex:none}
.sess .clock{margin-left:auto;font-weight:400;font-variant-numeric:tabular-nums;color:var(--muted);letter-spacing:0}
.sess .note{margin-top:2px;font-size:12px;color:var(--muted)}
.sess.open{border-color:#2c5a46}
.sess.open .dot{background:#5fd38d;opacity:1;box-shadow:0 0 0 3px rgba(95,211,141,.2)}
.sess.open .note{color:#8fdcaa}
@media (max-width:760px){.sessions{grid-template-columns:repeat(2,1fr);padding-top:12px}}

.views{display:flex;gap:4px;margin:0 0 18px;border-bottom:1px solid var(--line)}
.views button{padding:9px 14px;margin-bottom:-1px;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);font:inherit;cursor:pointer}
.views button:hover{color:var(--ink)}
.views button[aria-pressed="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.cal{color-scheme:light}
.cal .tradingview-widget-copyright{font-size:11px;text-align:center;padding-top:6px}
.cal .tradingview-widget-copyright a{color:var(--muted);text-decoration:none}

.fng{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px 10px;text-align:center;font-size:13px;color:var(--muted)}
.fng h4{margin:0 0 6px;font:600 12px/1.2 var(--ui);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.fng .gauge{color:var(--ink)}
.fng svg{display:block;width:100%;max-width:190px;margin:0 auto}
.fng .val{margin-top:-6px;font:600 32px/1 var(--serif);color:var(--ink)}
.fng .lab{margin-top:4px;font-weight:600;font-size:14px;color:var(--ink)}
.fng .hist{display:flex;justify-content:space-between;gap:8px;margin-top:10px;font-size:12px}
.fng .src{margin-top:8px;font-size:11px}
.fng .src a{color:var(--muted)}
.ticker .tradingview-widget-copyright{font-size:10px;text-align:center;padding:0 0 2px;line-height:1.2}
.ticker .tradingview-widget-copyright a{color:var(--muted);text-decoration:none}
.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 60px;display:grid;grid-template-columns:210px 1fr;gap:32px}
.side{position:sticky;top:78px;align-self:start}
nav button{display:flex;justify-content:space-between;width:100%;text-align:left;padding:8px 10px;margin:0 0 2px;border:0;border-left:3px solid transparent;background:none;color:var(--muted);font:inherit;cursor:pointer}
nav button:hover{color:var(--ink)}
nav button[aria-pressed="true"]{color:var(--ink);font-weight:600;border-left-color:var(--accent);background:var(--panel)}
nav .n{font-variant-numeric:tabular-nums;font-size:13px}

h2.day{margin:28px 0 6px;font:600 13px/1 var(--ui);color:var(--muted);letter-spacing:.02em}
h2.day:first-child{margin-top:0}
.item{display:grid;grid-template-columns:56px 1fr;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:3px}
.item h3{margin:0 0 4px;font:600 19px/1.3 var(--serif)}
.item h3 a{text-decoration:none}
.item h3 a:hover{color:var(--accent);text-decoration:underline}
.item p{margin:0 0 8px;color:var(--muted);max-width:68ch}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.src{font-weight:600}
.tag{background:var(--tag);color:var(--muted);padding:1px 8px;border-radius:10px;font-size:12px}
.msg{padding:40px 0;color:var(--muted)}
.more{display:block;margin:24px auto 0;padding:10px 22px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:inherit;cursor:pointer}

@media (max-width:760px){
  .bar{display:flex;flex-wrap:wrap;gap:10px}
  .brand{font-size:24px}
  .search{order:3;max-width:none;flex-basis:100%;margin:0}
  .stamp{margin-left:auto}
  .wrap{grid-template-columns:1fr;gap:16px;padding-top:16px}
  .side{position:static}
  nav{display:flex;overflow-x:auto;gap:6px;padding-bottom:4px}
  nav button{width:auto;white-space:nowrap;border:1px solid var(--line);border-radius:16px;margin:0;gap:8px}
  nav button[aria-pressed="true"]{border-color:var(--accent)}
  .item{grid-template-columns:1fr;gap:2px}
  .item h3{font-size:18px}
}
</style>
</head>
<body>
<div class="ticker" aria-label="Live market prices">
  <div class="tradingview-widget-container">
    <div class="tradingview-widget-container__widget"></div>
    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
    {
      "symbols": [
        {"proName": "FOREXCOM:SPXUSD", "title": "S&P 500"},
        {"proName": "FOREXCOM:NSXUSD", "title": "Nasdaq 100"},
        {"proName": "FOREXCOM:DJI", "title": "Dow Jones"},
        {"proName": "TVC:DAX", "title": "DAX"},
        {"proName": "TVC:DXY", "title": "US Dollar Index"},
        {"proName": "FX:EURUSD", "title": "EUR/USD"},
        {"proName": "FX:GBPUSD", "title": "GBP/USD"},
        {"proName": "FX:USDJPY", "title": "USD/JPY"},
        {"proName": "BITSTAMP:BTCUSD", "title": "Bitcoin"},
        {"proName": "BITSTAMP:ETHUSD", "title": "Ethereum"},
        {"proName": "OANDA:XAUUSD", "title": "Gold"},
        {"proName": "TVC:USOIL", "title": "Crude Oil"}
      ],
      "showSymbolLogo": false,
      "colorTheme": "dark",
      "isTransparent": true,
      "displayMode": "adaptive",
      "locale": "en"
    }
    </script>
    <div class="tradingview-widget-copyright"><a href="https://www.tradingview.com/" rel="noopener nofollow" target="_blank">Track all markets on TradingView</a></div>
  </div>
</div>

<header>
  <div class="bar">
    <div class="brand">AGORA NEWS</div>
    <div class="search"><input id="q" type="search" placeholder="Search headlines, tickers, sources" aria-label="Search news"></div>
    <div class="stamp" id="stamp"></div>
  </div>
</header>

<section class="sessions" id="sessions" aria-label="Market sessions" title="Typical forex session hours in each city's local time. Public holidays are not included."></section>

<div class="wrap">
  <div class="side">
    <nav id="nav" aria-label="Markets"></nav>
    <div class="fng" id="fng" aria-live="polite">Loading gauge...</div>
  </div>
  <div class="content">
    <div class="views">
      <button id="tabNews" type="button" aria-pressed="true">News</button>
      <button id="tabCal" type="button" aria-pressed="false">Economic calendar</button>
    </div>
    <main id="feed" aria-live="polite"><div class="msg">Loading news...</div></main>
    <section id="cal" class="cal" hidden aria-label="Economic calendar"></section>
  </div>
</div>

<script>
const CATS = [
  ["all","All markets"],["forex","Forex"],["stocks","Stocks"],["crypto","Crypto"],
  ["futures","Futures & commodities"],["bonds","Bonds"],["indices","Indices"],
  ["macro","Macro & central banks"]
];
const LABEL = Object.fromEntries(CATS);
const PAGE = 60;
const DATA_URL = "https://raw.githubusercontent.com/paschalisbala23-crypto/market-news/data/articles.json";
let all = [], cat = "all", query = "", shown = PAGE, updated = null;

const $ = id => document.getElementById(id);
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
};

function ago(date){
  const m = Math.round((Date.now() - date) / 60000);
  if (m < 1) return "just now";
  if (m < 60) return m + " min ago";
  const h = Math.round(m / 60);
  return h < 24 ? h + " h ago" : Math.round(h / 24) + " d ago";
}

function dayLabel(d){
  const today = new Date(), yest = new Date(Date.now() - 864e5);
  if (d.toDateString() === today.toDateString()) return "Today";
  if (d.toDateString() === yest.toDateString()) return "Yesterday";
  return d.toLocaleDateString(undefined, {weekday:"long", day:"numeric", month:"long"});
}

function matches(a){
  if (cat !== "all" && !a.categories.includes(cat)) return false;
  if (!query) return true;
  return (a.title + " " + a.snippet + " " + a.source).toLowerCase().includes(query);
}

function renderNav(){
  const nav = $("nav");
  nav.textContent = "";
  CATS.forEach(([key, name]) => {
    const b = el("button");
    b.setAttribute("aria-pressed", key === cat);
    b.append(el("span", "", name));
    b.onclick = () => { cat = key; shown = PAGE; showView("news"); render(); };
    nav.append(b);
  });
}

function renderFeed(){
  const feed = $("feed");
  feed.textContent = "";
  const list = all.filter(matches);
  if (!list.length){
    feed.append(el("div", "msg", query ? "No articles match your search. Try a different word." : "No articles in this market yet."));
    return;
  }
  let lastDay = "";
  list.slice(0, shown).forEach(a => {
    const d = new Date(a.published);
    const label = dayLabel(d);
    if (label !== lastDay){ feed.append(el("h2", "day", label)); lastDay = label; }

    const item = el("article", "item");
    item.append(el("div", "time", d.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"})));

    const body = el("div");
    const h = el("h3");
    const link = el("a", "", a.title);
    if (/^https?:\/\//.test(a.link)) link.href = a.link;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    h.append(link);
    body.append(h);
    if (a.snippet) body.append(el("p", "", a.snippet));

    const meta = el("div", "meta");
    meta.append(el("span", "src", a.source));
    a.categories.filter(c => LABEL[c] && c !== "all").slice(0, 3)
      .forEach(c => meta.append(el("span", "tag", LABEL[c])));
    body.append(meta);

    item.append(body);
    feed.append(item);
  });

  if (list.length > shown){
    const more = el("button", "more", "Show more");
    more.onclick = () => { shown += PAGE; renderFeed(); };
    feed.append(more);
  }
}

function render(){ renderNav(); renderFeed(); }

function renderStamp(){
  $("stamp").textContent = updated ? "Updated " + ago(updated) : "";
}

async function load(){
  try {
    let res;
    try {
      res = await fetch(DATA_URL + "?t=" + Date.now());
      if (!res.ok) throw new Error(res.status);
    } catch (e) {
      res = await fetch("articles.json?t=" + Date.now());
      if (!res.ok) throw new Error(res.status);
    }
    const data = await res.json();
    all = data.articles || [];
    updated = new Date(data.updated);
    render();
    renderStamp();
  } catch (e) {
    if (!all.length){
      $("feed").textContent = "";
      $("feed").append(el("div", "msg", "News could not be loaded. Check that articles.json exists in your repository, then refresh."));
    }
  }
}

/* ---- Market sessions clock (typical forex hours, local time, Mon-Fri) ---- */
const SESSIONS = [
  {name: "Sydney",   tz: "Australia/Sydney", open: 7, close: 16},
  {name: "Tokyo",    tz: "Asia/Tokyo",       open: 9, close: 18},
  {name: "London",   tz: "Europe/London",    open: 8, close: 17},
  {name: "New York", tz: "America/New_York", open: 8, close: 17}
];
const WEEKDAY = {Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6};

function localParts(tz){
  const parts = new Intl.DateTimeFormat("en-GB", {
    timeZone: tz, weekday: "short", hour: "2-digit", minute: "2-digit", hourCycle: "h23"
  }).formatToParts(new Date());
  const get = type => parts.find(p => p.type === type).value;
  return {wd: WEEKDAY[get("weekday")], h: +get("hour"), m: +get("minute")};
}

function span(mins){
  const h = Math.floor(mins / 60), m = mins % 60;
  if (h >= 24) return Math.floor(h / 24) + "d " + (h % 24) + "h";
  return (h ? h + "h " : "") + m + "m";
}

function sessionState(s){
  const {wd, h, m} = localParts(s.tz);
  const now = h * 60 + m, open = s.open * 60, close = s.close * 60;
  const clock = String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
  const weekday = wd >= 1 && wd <= 5;

  if (weekday && now >= open && now < close){
    return {isOpen: true, clock, text: "Open \u00b7 closes in " + span(close - now)};
  }
  let mins = 0;
  for (let d = 0; d <= 7; d++){
    const day = (wd + d) % 7;
    if (day < 1 || day > 5) continue;
    if (d === 0 && now >= open) continue;
    mins = d === 0 ? open - now : d * 1440 - now + open;
    break;
  }
  return {isOpen: false, clock, text: "Closed \u00b7 opens in " + span(mins)};
}

function renderSessions(){
  const box = $("sessions");
  box.textContent = "";
  SESSIONS.forEach(s => {
    const st = sessionState(s);
    const card = el("div", "sess" + (st.isOpen ? " open" : ""));
    const top = el("div", "top");
    top.append(el("span", "dot"), el("span", "", s.name), el("span", "clock", st.clock));
    card.append(top, el("div", "note", st.text));
    box.append(card);
  });
}

renderSessions();
setInterval(renderSessions, 30 * 1000);

/* ---- Tabs: News / Economic calendar ---- */
let calLoaded = false;

function showView(v){
  $("tabNews").setAttribute("aria-pressed", v === "news");
  $("tabCal").setAttribute("aria-pressed", v === "cal");
  $("feed").hidden = v !== "news";
  $("cal").hidden = v !== "cal";
  if (v === "cal" && !calLoaded) loadCalendar();
}

function loadCalendar(){
  calLoaded = true;
  const box = $("cal");
  const holder = el("div", "tradingview-widget-container");
  holder.append(el("div", "tradingview-widget-container__widget"));

  const s = document.createElement("script");
  s.src = "https://s3.tradingview.com/external-embedding/embed-widget-events.js";
  s.async = true;
  s.text = JSON.stringify({
    width: "100%",
    height: 640,
    colorTheme: "dark",
    isTransparent: true,
    locale: "en",
    importanceFilter: "0,1",
    countryFilter: "us,eu,gb,jp,de,fr,ch,au,ca,cn"
  });
  holder.append(s);

  const credit = el("div", "tradingview-widget-copyright");
  const link = el("a", "", "Track all markets on TradingView");
  link.href = "https://www.tradingview.com/";
  link.target = "_blank";
  link.rel = "noopener nofollow";
  credit.append(link);

  box.append(holder, credit);
}

/* ---- Crypto Fear & Greed gauge (data: alternative.me) ---- */
const FNG_URL = "https://api.alternative.me/fng/?limit=8";
const FNG_BANDS = [[0, 25, "#e5534b"], [25, 45, "#e8913a"], [45, 55, "#e3c04a"], [55, 75, "#8fd16a"], [75, 100, "#3fbf72"]];

function fngPoint(v, r){
  const a = Math.PI * (1 - v / 100);
  return [100 + r * Math.cos(a), 100 - r * Math.sin(a)];
}

function fngSvg(value){
  const arcs = FNG_BANDS.map(([from, to, color]) => {
    const [x1, y1] = fngPoint(from, 80), [x2, y2] = fngPoint(to, 80);
    return '<path d="M' + x1.toFixed(1) + " " + y1.toFixed(1) + " A80 80 0 0 1 " + x2.toFixed(1) + " " + y2.toFixed(1) +
           '" stroke="' + color + '" stroke-width="14" fill="none"/>';
  }).join("");
  const [nx, ny] = fngPoint(value, 64);
  return '<svg viewBox="0 0 200 112" role="img" aria-label="Fear and greed gauge showing ' + value + ' out of 100">' + arcs +
         '<line x1="100" y1="100" x2="' + nx.toFixed(1) + '" y2="' + ny.toFixed(1) + '" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>' +
         '<circle cx="100" cy="100" r="6" fill="currentColor"/></svg>';
}

async function loadFng(){
  const box = $("fng");
  try {
    const res = await fetch(FNG_URL);
    if (!res.ok) throw new Error(res.status);
    const rows = (await res.json()).data || [];
    const now = Number(rows[0].value);
    if (!isFinite(now) || now < 0 || now > 100) throw new Error("bad data");

    box.textContent = "";
    box.append(el("h4", "", "Crypto Fear & Greed"));
    const gauge = el("div", "gauge");
    gauge.insertAdjacentHTML("beforeend", fngSvg(now));
    box.append(gauge, el("div", "val", String(now)), el("div", "lab", rows[0].value_classification || ""));

    const hist = el("div", "hist");
    if (rows[1]) hist.append(el("span", "", "Yesterday " + rows[1].value));
    if (rows[7]) hist.append(el("span", "", "Last week " + rows[7].value));
    box.append(hist);

    const src = el("div", "src");
    const link = el("a", "", "Source: alternative.me");
    link.href = "https://alternative.me/crypto/fear-and-greed-index/";
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    src.append(link);
    box.append(src);
  } catch (e) {
    if (!box.querySelector("svg")) box.textContent = "Fear & Greed gauge is unavailable right now.";
  }
}

loadFng();
setInterval(loadFng, 30 * 60 * 1000);

$("q").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); shown = PAGE; showView("news"); renderFeed(); });
$("tabNews").onclick = () => showView("news");
$("tabCal").onclick = () => showView("cal");

load();
setInterval(load, 5 * 60 * 1000);
setInterval(renderStamp, 60 * 1000);
</script>
</body>
</html>
